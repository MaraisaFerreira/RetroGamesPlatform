spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/retro_games_dev?useTimezone=true&serverTimezone=UTC
    username: "${DB_RETRO_GAMES_DEV_USERNAME:${db_test.username}}"
    password: "${DB_RETRO_GAMES_DEV_PASSWORD:${db_test.password}}"
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: warn
    maraisaferreira.com.github: info
    org.flywaydb: info